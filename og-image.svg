<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000A21"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000A21;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6224;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="500" r="200" fill="#FF6224" opacity="0.05"/>
  <circle cx="1100" cy="130" r="150" fill="#FF6224" opacity="0.08"/>
  
  <!-- Logo -->
  <image x="500" y="100" width="200" height="200" href="logo-dark.svg"/>
  
  <!-- Main text -->
  <text x="600" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle">Equorum Protocol</text>
  
  <!-- Tagline -->
  <text x="600" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" fill="#9CA3AF" text-anchor="middle">Revenue Bonds on Arbitrum One</text>
  
  <!-- Orange accent line -->
  <rect x="450" y="500" width="300" height="4" rx="2" fill="url(#orangeGrad)"/>
  
  <!-- Badge -->
  <rect x="480" y="530" width="240" height="40" rx="20" fill="#10B981" opacity="0.9"/>
  <text x="600" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">Principal Protected</text>
  
  <!-- Network badge -->
  <rect x="1020" y="560" width="150" height="40" rx="8" fill="rgba(255,255,255,0.1)"/>
  <text x="1095" y="587" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#9CA3AF" text-anchor="middle">Built on Arbitrum</text>
</svg>
